<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI 原型 · hba-uigen</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
    background: #14171c; color: #d7dce2;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button {
    font: inherit; color: inherit; background: #232a33; border: 1px solid #35404d;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #2c3540; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  button.primary:hover { background: #3178bd; }
  select, textarea {
    font: inherit; color: inherit; background: #1b2129; border: 1px solid #35404d;
    border-radius: 6px; padding: 6px 8px;
  }
  /* ---- top bar ---- */
  #top-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: #1b2129; border-bottom: 1px solid #2a323c; flex: none;
  }
  #top-bar .brand { font-weight: 600; font-size: 14px; }
  #top-bar .spacer { flex: 1; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #2a323c; color: #9fb0c0;
  }
  .badge.ok { background: #1d4430; color: #7ee2a8; }
  .badge.warn { background: #4a3a1c; color: #ffd479; }
  /* ---- layout ---- */
  #layout { flex: 1; display: flex; min-height: 0; }
  #control-pane {
    width: 264px; flex: none; display: flex; flex-direction: column; gap: 10px;
    padding: 12px; border-right: 1px solid #2a323c; overflow-y: auto;
  }
  #req-input { width: 100%; height: 120px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .field-label { font-size: 11px; color: #8b98a5; margin-bottom: 4px; }
  #gen-status { font-size: 12px; color: #9fb0c0; min-height: 18px; }
  #gen-status.err { color: #ff9c9c; }
  #progress-track { height: 6px; border-radius: 3px; background: #232a33; overflow: hidden; }
  #progress-fill { height: 100%; width: 0; background: #2b6cb0; transition: width .25s; }
  #gen-log {
    list-style: none; padding: 0; margin: 0; font-size: 11px; color: #8b98a5;
    max-height: 140px; overflow-y: auto;
  }
  #gen-log li { padding: 2px 0; border-bottom: 1px dashed #262e37; }
  #version-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
  #version-list li {
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  #version-list li:hover { background: #232a33; }
  #version-list li.on { border-color: #2b6cb0; background: #1d2b3a; }
  #version-list .v-id { font-size: 11px; color: #6fb1ff; }
  #version-list .v-meta { font-size: 11px; color: #8b98a5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ---- canvas ---- */
  #canvas-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvas-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid #2a323c; flex: none;
  }
  #canvas-toolbar .spacer { flex: 1; }
  #zoom-label { min-width: 48px; text-align: center; color: #9fb0c0; }
  #canvas-hint { font-size: 11px; color: #6b7684; }
  #screen-canvas {
    flex: 1; overflow: auto; padding: 16px;
    background:
      linear-gradient(#1a1f26 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #1a1f26 1px, transparent 1px) 0 0 / 24px 24px,
      #14171c;
  }
  #canvas-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px; transform-origin: top left;
  }
  .screen-card {
    background: #1b2129; border: 1px solid #2f3945; border-radius: 10px;
    padding: 10px; cursor: grab; user-select: none;
  }
  .screen-card.selected { border-color: #2b6cb0; box-shadow: 0 0 0 2px rgba(43,108,176,.35); }
  .screen-card.dragging { opacity: .4; }
  .screen-card .thumb {
    height: 110px; border-radius: 6px; overflow: hidden; position: relative;
    background: #f5f6f8; border: 1px solid #2f3945;
  }
  .screen-card .thumb .t-bar { height: 18px; background: #2b6cb0; }
  .screen-card .thumb .t-body { padding: 6px; }
  .screen-card .thumb .t-line { height: 7px; border-radius: 3px; background: #d9dee5; margin-bottom: 5px; }
  .screen-card .thumb .t-line.short { width: 55%; }
  .screen-card .thumb .t-tabs {
    position: absolute; left: 0; right: 0; bottom: 0; height: 16px;
    background: #fff; border-top: 1px solid #e5e7eb; display: flex;
  }
  .screen-card .thumb .t-tabs i { flex: 1; border-right: 1px solid #eef0f3; }
  .screen-card .card-name { margin-top: 8px; font-weight: 600; }
  .screen-card .card-id { font-size: 11px; color: #8b98a5; }
  .screen-card .card-order { float: right; font-size: 11px; color: #6fb1ff; }
  .canvas-empty {
    grid-column: 1 / -1; text-align: center; color: #6b7684; padding: 48px 0;
    border: 1px dashed #2f3945; border-radius: 10px;
  }
  /* ---- preview pane ---- */
  #preview-pane {
    width: 432px; flex: none; display: flex; flex-direction: column;
    border-left: 1px solid #2a323c; min-height: 0;
  }
  #preview-head { padding: 8px 12px; border-bottom: 1px solid #2a323c; font-size: 12px; color: #9fb0c0; }
  #preview-title { color: #6fb1ff; }
  #preview-stage {
    flex: 1; overflow: auto; padding: 12px; display: flex; justify-content: center;
    background: #10131a; min-height: 0;
  }
  #phone-frame {
    width: 390px; height: 844px; flex: none; position: relative;
    border-radius: 18px; overflow: hidden; border: 1px solid #35404d;
    box-shadow: 0 12px 32px rgba(0,0,0,.45); background: #fff;
  }
  #preview-frame { width: 390px; height: 844px; border: 0; display: block; background: #fff; }
  #hotspot-layer { position: absolute; inset: 0; pointer-events: none; }
  .hotspot {
    position: absolute; pointer-events: auto; cursor: pointer;
    background: rgba(255, 176, 32, .28); border: 2px dashed #ffb020; border-radius: 6px;
  }
  .hotspot:hover { background: rgba(255, 176, 32, .5); }
  .hotspot .hs-label {
    position: absolute; left: 50%; top: -20px; transform: translateX(-50%);
    font-size: 10px; background: #ffb020; color: #14171c; padding: 1px 6px; border-radius: 8px;
    white-space: nowrap;
  }
  #play-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-top: 1px solid #2a323c; border-bottom: 1px solid #2a323c; flex: none;
  }
  #play-status { font-size: 11px; color: #9fb0c0; }
  #format-tabs {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px 0; flex: none;
  }
  #format-tabs button { padding: 4px 12px; font-size: 12px; }
  #format-tabs button.on { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
  #format-tabs .spacer { flex: 1; }
  #artifact-view {
    flex: 1; min-height: 0; margin: 8px 12px 12px; padding: 10px;
    background: #10131a; border: 1px solid #2a323c; border-radius: 8px;
    overflow: auto; font: 11px/1.6 Consolas, Menlo, monospace; color: #c6d2dd;
    white-space: pre; tab-size: 2;
  }
</style>
</head>
<body>
  <header id="top-bar">
    <span class="brand">UI 原型 · hba-uigen</span>
    <span id="bridge-status" class="badge">桥连接中…</span>
    <span class="spacer"></span>
    <button id="btn-import" title="从本地目录导入 *.html 原型(FR-2-6)">导入目录</button>
    <button id="btn-export" title="导出当前版本产物(FR-2-8)">导出</button>
    <button id="btn-refresh-versions" title="刷新历史版本(FR-2-7)">刷新版本</button>
  </header>

  <div id="layout">
    <!-- 左:需求输入 + 生成 + 版本历史 -->
    <aside id="control-pane">
      <div>
        <div class="field-label">需求描述(FR-2-1)</div>
        <textarea id="req-input" placeholder="例如:一款社区图书馆借阅 App,含首页推荐、图书列表、详情页与个人中心"></textarea>
      </div>
      <div class="row">
        <div>
          <div class="field-label">产物格式</div>
          <select id="format-select">
            <option value="html">HTML</option>
            <option value="jsx">JSX</option>
            <option value="vue">Vue</option>
          </select>
        </div>
        <div>
          <div class="field-label">屏幕数</div>
          <select id="count-select">
            <option>1</option><option>2</option><option selected>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
            <option>9</option><option>10</option>
          </select>
        </div>
      </div>
      <button id="btn-generate" class="primary">生成原型</button>
      <div id="gen-status">就绪</div>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <ul id="gen-log"></ul>
      <div class="field-label">历史版本(FR-2-7)</div>
      <ul id="version-list"><li class="v-meta">暂无版本</li></ul>
    </aside>

    <!-- 中:多屏画布 -->
    <section id="canvas-pane">
      <div id="canvas-toolbar">
        <button id="zoom-out" title="缩小">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" title="放大">+</button>
        <button id="zoom-reset">重置</button>
        <label title="在预览上叠加可点击的跳转热点(FR-2-2)">
          <input type="checkbox" id="hotspot-toggle" checked> 显示跳转热点
        </label>
        <span class="spacer"></span>
        <span id="canvas-hint">拖拽卡片可排序 · 点击选中</span>
      </div>
      <div id="screen-canvas">
        <div id="canvas-grid">
          <div class="canvas-empty">还没有原型。在左侧输入需求,点击「生成原型」。</div>
        </div>
      </div>
    </section>

    <!-- 右:390px 预览 + 演示播放 + 产物查看 -->
    <aside id="preview-pane">
      <div id="preview-head">390px 手机预览(FR-2-4) · <span id="preview-title">未选择屏幕</span></div>
      <div id="preview-stage">
        <div id="phone-frame">
          <iframe id="preview-frame" title="390px 手机预览" sandbox="allow-scripts"></iframe>
          <div id="hotspot-layer"></div>
        </div>
      </div>
      <div id="play-bar">
        <button id="btn-step-prev" title="上一屏">⏮ 上一屏</button>
        <button id="btn-play" class="primary">▶ 播放</button>
        <button id="btn-step-next" title="下一屏">下一屏 ⏭</button>
        <span id="play-status">已暂停</span>
      </div>
      <div id="format-tabs">
        <button data-fmt="html" class="on">HTML</button>
        <button data-fmt="jsx">JSX</button>
        <button data-fmt="vue">Vue</button>
        <span class="spacer"></span>
        <button id="btn-copy">复制产物</button>
      </div>
      <pre id="artifact-view"><code id="artifact-code">(选择屏幕后查看产物)</code></pre>
    </aside>
  </div>

<script>
/*!
 * UiGenBridge — panel <-> host MCP bridge adapter for the hba-uigen panel.
 *
 * Protocol (reverse-engineered from the official ZCode pdf-plugin):
 *  - The panel runs as an mcp-app iframe ("text/html;profile=mcp-app").
 *  - It is an MCP *client*: newline-free JSON-RPC 2.0 envelopes are exchanged
 *    with the host over window.parent.postMessage(msg, "*") and the window
 *    "message" event (see pdf-plugin dist/ui bundle: transport constructor
 *    `new ...Transport(window.parent, window.parent)`).
 *  - Handshake: MCP "initialize" -> "notifications/initialized" -> custom
 *    request "ui/initialize" { appInfo, appCapabilities, protocolVersion }.
 *  - "tools/call" reaches the plugin MCP server declared in
 *    plugin.json ui.surfaces[].server ("hba-uigen").
 *  - "notifications/progress" carries generation progress
 *    (params: { progressToken, progress, total, message }).
 *  - "notifications/resources/updated" carries resource change pushes
 *    (host-side ops pluginUi.resourceUpdated / pluginUi.resourceListChanged).
 *
 * This adapter exposes the minimal interface required by the migration:
 *    callTool(name, args)        -> Promise<structuredContent>
 *    onResourceUpdate(cb)        -> subscribe to resource updates
 *    onProgress(cb)              -> subscribe to generation progress
 *    connect()                   -> Promise<"mcp" | "standalone">
 *
 * If no host answers (opened outside ZCode, or during integration bring-up),
 * the bridge degrades to a local in-page demo backend so the panel stays fully
 * usable. Integration-phase verification notes live in README.md.
 */
(function (global) {
  "use strict";

  var PROTOCOL_VERSION = "2025-06-18";
  var CLIENT_INFO = { name: "hba-uigen-panel", version: "0.1.0" };
  var APP_INFO = { name: "hba-uigen", version: "0.1.0" };

  // -------------------------------------------------------------------------
  // local demo backend — compact mirror of server.mjs / uigen_sidecar.py demo
  // -------------------------------------------------------------------------
  var DEMO_NAMES = ["首页", "列表页", "详情页", "个人中心", "设置页", "搜索页", "消息页", "订单页", "登录页", "结果页"];

  function demoScreens(prompt, format, count) {
    var title = String(prompt || "").trim().slice(0, 12) || "UI 原型";
    var short = String(prompt || "").trim().slice(0, 40);
    var tabs = Math.min(count, 5);
    var screens = [];
    for (var i = 0; i < count; i++) {
      var hotspots = [];
      for (var j = 0; j < tabs; j++) {
        hotspots.push({
          to: "s" + (j + 1),
          label: DEMO_NAMES[j % DEMO_NAMES.length],
          x: Math.round((j * 390) / tabs),
          y: 774,
          w: Math.floor(390 / tabs),
          h: 70
        });
      }
      screens.push({
        id: "s" + (i + 1),
        name: DEMO_NAMES[i % DEMO_NAMES.length],
        html: demoHtml(i, title, short, hotspots),
        jsx: demoJsx(i, title, short),
        vue: demoVue(i, title, short),
        hotspots: hotspots
      });
    }
    return screens;
  }

  function demoHtml(i, title, prompt, hotspots) {
    var name = DEMO_NAMES[i % DEMO_NAMES.length];
    var cards = [
      { t: "快速上手", d: "三步完成配置，立即体验核心流程。" },
      { t: "核心功能", d: "围绕「" + ["浏览", "管理", "设置", "发现"][i % 4] + "」场景设计的关键能力。" },
      { t: "帮助与支持", d: "常见问题与在线客服入口。" }
    ].map(function (c) {
      return '      <div class="card"><h2>' + c.t + "</h2><p>" + c.d + "</p></div>";
    }).join("\n");
    var tabsHtml = (hotspots || []).map(function (h) {
      return '      <a class="tab' + (h.to === "s" + (i + 1) ? " on" : "") + '" data-uigen-goto="' + h.to + '">' + h.label + "</a>";
    }).join("\n");
    return "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"utf-8\">\n" +
      "  <meta name=\"viewport\" content=\"width=390, initial-scale=1\">\n" +
      "  <title>" + name + " · " + title + "</title>\n" +
      "  <style>\n    * { box-sizing: border-box; margin: 0; }\n" +
      "    body { width: 390px; min-height: 844px; font-family: system-ui, sans-serif; background: #f5f6f8; color: #1f2329; }\n" +
      "    .app-bar { height: 56px; display: flex; align-items: center; padding: 0 16px; background: #2b6cb0; color: #fff; font-size: 17px; font-weight: 600; }\n" +
      "    main { padding: 16px; padding-bottom: 96px; }\n    h1 { font-size: 22px; margin-bottom: 6px; }\n" +
      "    .sub { font-size: 12px; color: #6b7280; margin-bottom: 16px; }\n" +
      "    .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }\n" +
      "    .card h2 { font-size: 15px; margin-bottom: 6px; }\n    .card p { font-size: 13px; color: #4b5563; line-height: 1.6; }\n" +
      "    .tab-bar { position: fixed; left: 0; bottom: 0; width: 390px; height: 70px; display: flex; background: #fff; border-top: 1px solid #e5e7eb; }\n" +
      "    .tab { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6b7280; text-decoration: none; }\n" +
      "    .tab.on { color: #2b6cb0; font-weight: 600; }\n  </style>\n</head>\n<body>\n" +
      '  <header class="app-bar">' + title + "</header>\n  <main>\n    <h1>" + name + "</h1>\n" +
      '    <p class="sub">uigen 演示生成 · 需求：' + (prompt || "(空)") + "</p>\n" + cards + "\n  </main>\n" +
      '  <nav class="tab-bar">\n' + tabsHtml + "\n  </nav>\n" +
      '  \x3cscript type="application/json" id="uigen-hotspots">' + JSON.stringify(hotspots || []) + "\x3c/script>\n</body>\n</html>\n";
  }

  function demoJsx(i, title, prompt) {
    var name = DEMO_NAMES[i % DEMO_NAMES.length];
    var cards = [
      { t: "快速上手", d: "三步完成配置，立即体验核心流程。" },
      { t: "核心功能", d: "围绕「" + ["浏览", "管理", "设置", "发现"][i % 4] + "」场景设计的关键能力。" },
      { t: "帮助与支持", d: "常见问题与在线客服入口。" }
    ].map(function (c) {
      return '        <div className="card"><h2>' + c.t + "</h2><p>" + c.d + "</p></div>";
    }).join("\n");
    return "// uigen demo artifact — screen " + (i + 1) + ": " + name + "\nexport default function Screen" + (i + 1) + "() {\n  return (\n" +
      '    <div className="phone" style={{ width: 390, minHeight: 844 }}>\n' +
      '      <header className="app-bar">' + title + "</header>\n      <main>\n        <h1>" + name + "</h1>\n" +
      '        <p className="sub">uigen 演示生成 · 需求：' + (prompt || "(空)") + "</p>\n" + cards +
      '\n      </main>\n      <nav className="tab-bar">{/* hotspots: see ui state */}</nav>\n    </div>\n  );\n}\n';
  }

  function demoVue(i, title, prompt) {
    var name = DEMO_NAMES[i % DEMO_NAMES.length];
    var cards = [
      { t: "快速上手", d: "三步完成配置，立即体验核心流程。" },
      { t: "核心功能", d: "围绕「" + ["浏览", "管理", "设置", "发现"][i % 4] + "」场景设计的关键能力。" },
      { t: "帮助与支持", d: "常见问题与在线客服入口。" }
    ].map(function (c) {
      return '      <div class="card"><h2>' + c.t + "</h2><p>" + c.d + "</p></div>";
    }).join("\n");
    return "<template>\n  <div class=\"phone\">\n    <header class=\"app-bar\">" + title + "</header>\n    <main>\n      <h1>" + name + "</h1>\n" +
      '      <p class="sub">uigen 演示生成 · 需求：' + (prompt || "(空)") + "</p>\n" + cards +
      "\n    </main>\n    <nav class=\"tab-bar\"><!-- hotspots: see ui state --></nav>\n  </div>\n</template>\n\n\x3cscript>\n" +
      "// uigen demo artifact — screen " + (i + 1) + ": " + name + "\nexport default {\n  name: \"Screen" + (i + 1) + "\"\n};\n\x3c/script>\n\n" +
      "<style scoped>\n.phone { width: 390px; min-height: 844px; font-family: system-ui, sans-serif; }\n</style>\n";
  }

  function localBackend() {
    var versions = [];
    var seq = 0;

    function save(rec) {
      seq += 1;
      var id = rec.id || ("v" + String(seq).padStart(3, "0") + "-local");
      rec = Object.assign({}, rec, { id: id });
      versions = versions.filter(function (v) { return v.id !== id; });
      versions.push({
        id: id,
        createdAt: rec.createdAt,
        prompt: rec.prompt,
        format: rec.format,
        screenCount: (rec.screens || []).length,
        source: rec.source || "generate"
      });
      rec._index = versions[versions.length - 1];
      rec._full = true;
      store[id] = rec;
      return rec;
    }
    var store = {};

    return {
      callTool: function (name, args, emitProgress) {
        return new Promise(function (resolve, reject) {
          setTimeout(function () {
            try {
              if (name === "uigen_generate") {
                var prompt = String((args && args.prompt) || "").trim();
                if (!prompt) return reject(new Error("prompt is required"));
                var format = (args && args.format) || "html";
                var count = Math.min(10, Math.max(1, parseInt(args && args.screenCount, 10) || 3));
                if (emitProgress) emitProgress({ progress: 0, total: count + 2, message: "准备生成(本地演示)" });
                var screens = demoScreens(prompt, format, count);
                if (emitProgress) {
                  for (var i = 0; i < count; i++) emitProgress({ progress: i + 1, total: count + 2, message: "生成屏幕 " + (i + 1) + "/" + count });
                }
                var rec = save({
                  prompt: prompt,
                  format: format,
                  createdAt: new Date().toISOString(),
                  screens: screens,
                  source: "demo-local"
                });
                if (emitProgress) emitProgress({ progress: count + 2, total: count + 2, message: "完成" });
                resolve({
                  ok: true,
                  engine: "demo(panel-local)",
                  versionId: rec.id,
                  prompt: rec.prompt,
                  format: rec.format,
                  screenCount: screens.length,
                  screens: screens
                });
              } else if (name === "uigen_list_versions") {
                var limit = Math.max(1, parseInt(args && args.limit, 10) || 20);
                resolve({ ok: true, versions: versions.slice().reverse().slice(0, limit) });
              } else if (name === "uigen_get_version") {
                var rec2 = store[String((args && args.versionId) || "")];
                if (!rec2) return reject(new Error("version not found: " + (args && args.versionId)));
                resolve({ ok: true, version: rec2 });
              } else if (name === "uigen_export") {
                var rec3 = store[String((args && args.versionId) || "")];
                if (!rec3) return reject(new Error("version not found: " + (args && args.versionId)));
                var files = [];
                (rec3.screens || []).forEach(function (s) {
                  ["html", "jsx", "vue"].forEach(function (ext) {
                    if (s[ext] && String(s[ext]).trim()) files.push({ name: s.id + "-" + s.name + "." + ext, bytes: String(s[ext]).length });
                  });
                });
                resolve({ ok: true, versionId: rec3.id, targetDir: "(panel-local, 未写盘)", files: files });
              } else if (name === "uigen_import_dir") {
                reject(new Error("panel-local 模式不支持目录导入,请在 ZCode 宿主内使用"));
              } else {
                reject(new Error("unknown tool: " + name));
              }
            } catch (e) {
              reject(e);
            }
          }, 30);
        });
      }
    };
  }

  // -------------------------------------------------------------------------
  // bridge
  // -------------------------------------------------------------------------
  function createUiGenBridge(options) {
    options = options || {};
    var mode = "unknown";
    var pending = new Map();
    var seq = 0;
    var resourceCbs = [];
    var progressCbs = [];
    var backend = localBackend();
    var connected = false;

    function post(msg) {
      var target = global.parent && global.parent !== global ? global.parent : null;
      if (!target) return false;
      try {
        target.postMessage(msg, "*");
        return true;
      } catch (e) {
        return false;
      }
    }

    function sendRequest(method, params, timeoutMs) {
      return new Promise(function (resolve, reject) {
        seq += 1;
        var id = seq;
        var timer = setTimeout(function () {
          pending.delete(id);
          reject(new Error("bridge timeout: " + method));
        }, timeoutMs || options.requestTimeoutMs || 15000);
        pending.set(id, {
          resolve: function (v) { clearTimeout(timer); resolve(v); },
          reject: function (e) { clearTimeout(timer); reject(e); }
        });
        if (!post({ jsonrpc: "2.0", id: id, method: method, params: params || {} })) {
          clearTimeout(timer);
          pending.delete(id);
          reject(new Error("no host window"));
        }
      });
    }

    function sendNotification(method, params) {
      post({ jsonrpc: "2.0", method: method, params: params || {} });
    }

    function onMessage(ev) {
      var msg = ev && ev.data;
      if (!msg || msg.jsonrpc !== "2.0") return;
      if (msg.id !== undefined && msg.id !== null && (msg.result !== undefined || msg.error !== undefined)) {
        var entry = pending.get(msg.id);
        if (!entry) return;
        pending.delete(msg.id);
        if (msg.error) entry.reject(new Error(msg.error.message || "bridge error"));
        else entry.resolve(msg.result);
        return;
      }
      if (typeof msg.method === "string") {
        if (msg.method === "notifications/progress" && msg.params) {
          progressCbs.forEach(function (cb) { try { cb(msg.params); } catch (e) { /* cb error */ } });
        } else if (
          msg.method === "notifications/resources/updated" ||
          msg.method === "notifications/resources/list_changed"
        ) {
          resourceCbs.forEach(function (cb) { try { cb(msg.params || {}); } catch (e) { /* cb error */ } });
        } else if (msg.method === "pluginUi.resourceUpdated" || (msg.params && msg.params.op === "pluginUi.resourceUpdated")) {
          resourceCbs.forEach(function (cb) { try { cb(msg.params || {}); } catch (e) { /* cb error */ } });
        }
      }
    }

    function extractResult(raw) {
      if (raw && raw.structuredContent !== undefined) return raw.structuredContent;
      if (raw && Array.isArray(raw.content)) {
        for (var i = 0; i < raw.content.length; i++) {
          if (raw.content[i].type === "text") {
            try { return JSON.parse(raw.content[i].text); } catch (e) { /* keep raw */ }
          }
        }
      }
      return raw;
    }

    var bridge = {
      get mode() { return mode; },
      onResourceUpdate: function (cb) { if (typeof cb === "function") resourceCbs.push(cb); },
      onProgress: function (cb) { if (typeof cb === "function") progressCbs.push(cb); },

      connect: function () {
        return new Promise(function (resolve) {
          if (global.parent && global.parent !== global) {
            global.addEventListener("message", onMessage);
            var timeoutMs = options.connectTimeoutMs || 2500;
            sendRequest("initialize", {
              protocolVersion: PROTOCOL_VERSION,
              capabilities: {},
              clientInfo: CLIENT_INFO
            }, timeoutMs).then(function (initResult) {
              connected = true;
              mode = "mcp";
              sendNotification("notifications/initialized", {});
              // custom post-init handshake seen in the pdf-plugin bundle
              sendRequest("ui/initialize", {
                appInfo: APP_INFO,
                appCapabilities: { tools: {}, displayModes: ["inline", "fullscreen"] },
                protocolVersion: (initResult && initResult.protocolVersion) || PROTOCOL_VERSION
              }, timeoutMs).catch(function () { /* optional, tolerate older hosts */ });
              resolve(mode);
            }).catch(function () {
              mode = "standalone";
              resolve(mode);
            });
          } else {
            mode = "standalone";
            resolve(mode);
          }
        });
      },

      callTool: function (name, args) {
        if (mode === "mcp" && connected) {
          var token = "uigen-" + (++seq);
          return sendRequest("tools/call", {
            name: name,
            arguments: args || {},
            _meta: { progressToken: token }
          }).then(extractResult);
        }
        return backend.callTool(name, args || {}, function (p) {
          progressCbs.forEach(function (cb) { try { cb(p); } catch (e) { /* cb error */ } });
        });
      },

      // low-level escape hatch (integration bring-up / diagnostics)
      request: sendRequest,
      notify: sendNotification
    };
    return bridge;
  }

  var api = { create: createUiGenBridge, version: "0.1.0" };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  global.UiGenBridge = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // state
  // ------------------------------------------------------------------
  var state = {
    screens: [],          // [{id,name,html,jsx,vue,hotspots}]
    selected: -1,
    versionId: "",
    zoom: 1,
    format: "html",
    playing: false,
    playTimer: null
  };

  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------------
  // bridge wiring
  // ------------------------------------------------------------------
  var bridge = window.UiGenBridge.create({ connectTimeoutMs: 2500 });

  function setBridgeStatus() {
    var el = $("bridge-status");
    if (bridge.mode === "mcp") {
      el.textContent = "MCP 桥已连接";
      el.className = "badge ok";
    } else {
      el.textContent = "本地演示模式(未检测到宿主桥)";
      el.className = "badge warn";
    }
  }

  bridge.onProgress(function (p) {
    var total = p.total || 1;
    var done = typeof p.progress === "number" ? p.progress : 0;
    $("progress-fill").style.width = Math.min(100, Math.round((done / total) * 100)) + "%";
    if (p.message) logLine(p.message);
    $("gen-status").textContent = "生成中… " + (p.message || "");
  });

  bridge.onResourceUpdate(function () {
    refreshVersions();
  });

  // ------------------------------------------------------------------
  // generate (FR-2-1)
  // ------------------------------------------------------------------
  function logLine(text) {
    var li = document.createElement("li");
    li.textContent = new Date().toLocaleTimeString() + "  " + text;
    var log = $("gen-log");
    log.insertBefore(li, log.firstChild);
    while (log.children.length > 40) log.removeChild(log.lastChild);
  }

  function setStatus(text, isErr) {
    var el = $("gen-status");
    el.textContent = text;
    el.className = isErr ? "err" : "";
  }

  async function doGenerate() {
    var prompt = $("req-input").value.trim();
    if (!prompt) { setStatus("请先输入需求描述", true); return; }
    var format = $("format-select").value;
    var screenCount = parseInt($("count-select").value, 10) || 3;
    $("btn-generate").disabled = true;
    $("progress-fill").style.width = "0%";
    setStatus("生成中…");
    logLine("开始生成:" + prompt.slice(0, 30) + (prompt.length > 30 ? "…" : ""));
    try {
      var res = await bridge.callTool("uigen_generate", {
        prompt: prompt, format: format, screenCount: screenCount
      });
      if (res && res.ok && Array.isArray(res.screens) && res.screens.length) {
        state.screens = res.screens;
        state.versionId = res.versionId || "";
        $("progress-fill").style.width = "100%";
        setStatus("完成 · 引擎:" + (res.engine || "?") + " · 版本 " + (res.versionId || "-"));
        logLine("生成完成:" + res.screens.length + " 屏,版本 " + (res.versionId || "-"));
        renderCanvas();
        selectScreen(0);
        refreshVersions();
      } else {
        setStatus("生成失败:" + (res && res.error ? res.error : "未知错误"), true);
      }
    } catch (e) {
      setStatus("生成失败:" + e.message, true);
      logLine("错误:" + e.message);
    } finally {
      $("btn-generate").disabled = false;
    }
  }

  // ------------------------------------------------------------------
  // canvas: grid, zoom, drag reorder, select (FR-2-2)
  // ------------------------------------------------------------------
  function renderCanvas() {
    var grid = $("canvas-grid");
    grid.textContent = "";
    if (!state.screens.length) {
      var empty = document.createElement("div");
      empty.className = "canvas-empty";
      empty.textContent = "还没有原型。在左侧输入需求,点击「生成原型」。";
      grid.appendChild(empty);
      return;
    }
    state.screens.forEach(function (s, i) {
      var card = document.createElement("div");
      card.className = "screen-card" + (i === state.selected ? " selected" : "");
      card.draggable = true;
      card.dataset.index = String(i);

      var thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.innerHTML =
        '<div class="t-bar"></div><div class="t-body">' +
        '<div class="t-line"></div><div class="t-line short"></div>' +
        '<div class="t-line"></div><div class="t-line short"></div></div>' +
        '<div class="t-tabs"><i></i><i></i><i></i><i></i></div>';

      var name = document.createElement("div");
      name.className = "card-name";
      name.textContent = s.name || s.id;

      var meta = document.createElement("div");
      meta.className = "card-id";
      meta.innerHTML = '<span class="card-order">#' + (i + 1) + "</span>" + (s.id || "");

      card.appendChild(thumb);
      card.appendChild(name);
      card.appendChild(meta);

      card.addEventListener("click", function () { selectScreen(i); });
      card.addEventListener("dragstart", function (ev) {
        card.classList.add("dragging");
        ev.dataTransfer.setData("text/plain", String(i));
        ev.dataTransfer.effectAllowed = "move";
      });
      card.addEventListener("dragend", function () { card.classList.remove("dragging"); });
      card.addEventListener("dragover", function (ev) {
        ev.preventDefault();
        ev.dataTransfer.dropEffect = "move";
      });
      card.addEventListener("drop", function (ev) {
        ev.preventDefault();
        var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
        var to = i;
        if (isNaN(from) || from === to) return;
        var moved = state.screens.splice(from, 1)[0];
        state.screens.splice(to, 0, moved);
        if (state.selected === from) state.selected = to;
        else if (from < state.selected && to >= state.selected) state.selected -= 1;
        else if (from > state.selected && to <= state.selected) state.selected += 1;
        logLine("排序调整:" + moved.name + " → 第 " + (to + 1) + " 位");
        renderCanvas();
        renderPreview();
      });

      grid.appendChild(card);
    });
    applyZoom();
  }

  function applyZoom() {
    var grid = $("canvas-grid");
    grid.style.transform = "scale(" + state.zoom + ")";
    $("zoom-label").textContent = Math.round(state.zoom * 100) + "%";
  }

  function setZoom(z) {
    state.zoom = Math.min(1.6, Math.max(0.5, z));
    applyZoom();
  }

  // ------------------------------------------------------------------
  // preview 390px + hotspots (FR-2-2 / FR-2-4)
  // ------------------------------------------------------------------
  function currentScreen() {
    return state.screens[state.selected] || null;
  }

  function renderPreview() {
    var s = currentScreen();
    var frame = $("preview-frame");
    var layer = $("hotspot-layer");
    layer.textContent = "";
    if (!s) {
      frame.srcdoc = "<!doctype html><html><body style=\"font-family:system-ui;color:#888;padding:24px\">未选择屏幕</body></html>";
      $("preview-title").textContent = "未选择屏幕";
      renderArtifact();
      return;
    }
    frame.srcdoc = s.html || "<!doctype html><html><body>该屏幕没有 HTML 产物</body></html>";
    $("preview-title").textContent = (s.name || s.id) + " · 390 × 844";
    if ($("hotspot-toggle").checked) {
      (s.hotspots || []).forEach(function (h) {
        var el = document.createElement("div");
        el.className = "hotspot";
        el.style.left = h.x + "px";
        el.style.top = h.y + "px";
        el.style.width = h.w + "px";
        el.style.height = h.h + "px";
        var label = document.createElement("span");
        label.className = "hs-label";
        label.textContent = "→ " + (h.label || h.to);
        el.appendChild(label);
        el.addEventListener("click", function () {
          var target = state.screens.findIndex(function (x) { return x.id === h.to; });
          if (target >= 0) {
            selectScreen(target);
            logLine("热点跳转:" + (s.name || s.id) + " → " + (state.screens[target].name || h.to));
          }
        });
        layer.appendChild(el);
      });
    }
  }

  function renderArtifact() {
    var s = currentScreen();
    var code = $("artifact-code");
    if (!s) { code.textContent = "(选择屏幕后查看产物)"; return; }
    code.textContent = s[state.format] || "(该格式无产物)";
  }

  function selectScreen(i) {
    if (i < 0 || i >= state.screens.length) return;
    state.selected = i;
    renderCanvas();
    renderPreview();
    renderArtifact();
    updatePlayStatus();
  }

  // ------------------------------------------------------------------
  // demo playback (FR-2-5): play / pause / step
  // ------------------------------------------------------------------
  function updatePlayStatus() {
    var n = state.screens.length;
    var pos = state.selected >= 0 ? (state.selected + 1) + "/" + n : "-/" + n;
    $("play-status").textContent = (state.playing ? "播放中 " : "已暂停 ") + pos;
    $("btn-play").textContent = state.playing ? "⏸ 暂停" : "▶ 播放";
  }

  function step(delta) {
    if (!state.screens.length) return;
    var next = state.selected + delta;
    if (next < 0) next = state.screens.length - 1;
    if (next >= state.screens.length) next = 0;
    selectScreen(next);
    updatePlayStatus();
  }

  function togglePlay() {
    if (!state.screens.length) { setStatus("没有可播放的屏幕", true); return; }
    state.playing = !state.playing;
    if (state.playing) {
      state.playTimer = setInterval(function () { step(1); }, 2200);
      logLine("演示播放开始");
    } else {
      clearInterval(state.playTimer);
      state.playTimer = null;
      logLine("演示播放暂停");
    }
    updatePlayStatus();
  }

  // ------------------------------------------------------------------
  // versions / import / export (FR-2-6 / FR-2-7 / FR-2-8)
  // ------------------------------------------------------------------
  async function refreshVersions() {
    try {
      var res = await bridge.callTool("uigen_list_versions", { limit: 30 });
      var list = $("version-list");
      list.textContent = "";
      var versions = (res && res.versions) || [];
      if (!versions.length) {
        var li0 = document.createElement("li");
        li0.className = "v-meta";
        li0.textContent = "暂无版本";
        list.appendChild(li0);
        return;
      }
      versions.forEach(function (v) {
        var li = document.createElement("li");
        if (v.id === state.versionId) li.className = "on";
        var t = document.createElement("div");
        t.className = "v-id";
        t.textContent = v.id;
        var m = document.createElement("div");
        m.className = "v-meta";
        m.textContent = (v.screenCount + " 屏 · " + (v.createdAt || "").slice(0, 19).replace("T", " ") + " · " + (v.prompt || "").slice(0, 24));
        li.appendChild(t);
        li.appendChild(m);
        li.addEventListener("click", function () { loadVersion(v.id); });
        list.appendChild(li);
      });
    } catch (e) {
      logLine("版本列表刷新失败:" + e.message);
    }
  }

  async function loadVersion(id) {
    try {
      var res = await bridge.callTool("uigen_get_version", { versionId: id });
      if (res && res.ok && res.version && Array.isArray(res.version.screens)) {
        state.screens = res.version.screens;
        state.versionId = id;
        renderCanvas();
        selectScreen(0);
        setStatus("已载入版本 " + id);
        logLine("载入版本:" + id);
        refreshVersions();
      } else {
        setStatus("载入失败:" + (res && res.error ? res.error : "未知错误"), true);
      }
    } catch (e) {
      setStatus("载入失败:" + e.message, true);
    }
  }

  async function doImport() {
    var dir = window.prompt("要导入的本地目录(含 *.html):");
    if (!dir) return;
    try {
      var res = await bridge.callTool("uigen_import_dir", { dir: dir });
      if (res && res.ok) {
        setStatus("已导入 " + res.imported + " 个原型 → 版本 " + res.versionId);
        logLine("目录导入:" + res.dir + " → " + res.versionId);
        await loadVersion(res.versionId);
      } else {
        setStatus("导入失败:" + (res && res.error ? res.error : "未知错误"), true);
      }
    } catch (e) {
      setStatus("导入失败:" + e.message, true);
    }
  }

  async function doExport() {
    if (!state.versionId) { setStatus("请先生成或载入一个版本", true); return; }
    try {
      var res = await bridge.callTool("uigen_export", { versionId: state.versionId });
      if (res && res.ok) {
        var names = (res.files || []).map(function (f) { return f.name; }).join(", ");
        setStatus("已导出 " + (res.files || []).length + " 个文件 → " + res.targetDir);
        logLine("导出:" + res.targetDir + " (" + names.slice(0, 80) + ")");
      } else {
        setStatus("导出失败:" + (res && res.error ? res.error : "未知错误"), true);
      }
    } catch (e) {
      setStatus("导出失败:" + e.message, true);
    }
  }

  // ------------------------------------------------------------------
  // events
  // ------------------------------------------------------------------
  $("btn-generate").addEventListener("click", doGenerate);
  $("btn-import").addEventListener("click", doImport);
  $("btn-export").addEventListener("click", doExport);
  $("btn-refresh-versions").addEventListener("click", refreshVersions);
  $("zoom-in").addEventListener("click", function () { setZoom(state.zoom + 0.1); });
  $("zoom-out").addEventListener("click", function () { setZoom(state.zoom - 0.1); });
  $("zoom-reset").addEventListener("click", function () { setZoom(1); });
  $("hotspot-toggle").addEventListener("change", renderPreview);
  $("btn-play").addEventListener("click", togglePlay);
  $("btn-step-prev").addEventListener("click", function () { step(-1); });
  $("btn-step-next").addEventListener("click", function () { step(1); });

  Array.prototype.forEach.call(document.querySelectorAll("#format-tabs [data-fmt]"), function (btn) {
    btn.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll("#format-tabs [data-fmt]"), function (b) {
        b.classList.remove("on");
      });
      btn.classList.add("on");
      state.format = btn.dataset.fmt;
      renderArtifact();
    });
  });

  $("btn-copy").addEventListener("click", function () {
    var s = currentScreen();
    if (!s) return;
    var text = s[state.format] || "";
    function done() { setStatus("已复制 " + state.format + " 产物(" + text.length + " 字符)"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { setStatus("复制失败:" + e.message, true); }
    document.body.removeChild(ta);
  }

  document.addEventListener("keydown", function (ev) {
    if (ev.target && (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "INPUT")) return;
    if (ev.key === "ArrowRight") { step(1); }
    else if (ev.key === "ArrowLeft") { step(-1); }
    else if (ev.key === " ") { ev.preventDefault(); togglePlay(); }
  });

  // ------------------------------------------------------------------
  // boot
  // ------------------------------------------------------------------
  renderCanvas();
  renderPreview();
  updatePlayStatus();
  bridge.connect().then(function () {
    setBridgeStatus();
    refreshVersions();
  });
})();
</script>
</body>
</html>
