<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBA 运行面板</title>
<style>
  /* 双主题:色板消费宿主注入的 MCP Apps 标准样式变量(ZCode 主题 token,
     见宿主 pluginUiStyleVariables.ts),兜底值 = ZCode 自身 zai-dark / zai-light
     色值,独立打开时兜底即准;宿主经 hostContext.theme /
     host-context-changed 通知切换 documentElement[data-theme]。 */
  :root, [data-theme="dark"] {
    --bg: var(--color-background-primary, #161616);
    --bg2: var(--color-background-secondary, #202020);
    --fill: #2b2b2b;
    --hover: var(--color-background-ghost, rgba(255, 255, 255, 0.05));
    --selected: rgba(255, 255, 255, 0.1);
    --console-bg: var(--color-background-primary, #161616);
    --fg: var(--color-text-primary, #d4d4d4);
    --fg-dim: var(--color-text-secondary, rgba(212, 212, 212, 0.6));
    --accent: var(--color-ring-primary, #ffffff);
    --primary: var(--color-background-inverse, #ffffff);
    --primary-fg: var(--color-text-inverse, #000000);
    --ok: var(--color-text-success, #46bf72);
    --err: var(--color-text-danger, #ff5c5c);
    --warn: var(--color-text-warning, #ff8a30);
    --border: var(--color-border-primary, rgba(255, 255, 255, 0.1));
    --border-hover: var(--color-border-secondary, rgba(255, 255, 255, 0.15));
    --mono: "Cascadia Code", Consolas, "Courier New", monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: var(--color-background-primary, #f8f8f8);
    --bg2: var(--color-background-secondary, #ffffff);
    --fill: #ffffff;
    --hover: var(--color-background-ghost, rgba(13, 13, 13, 0.05));
    --selected: rgba(13, 13, 13, 0.05);
    --console-bg: var(--color-background-primary, #f8f8f8);
    --fg: var(--color-text-primary, #262626);
    --fg-dim: var(--color-text-secondary, rgba(38, 38, 38, 0.6));
    --accent: var(--color-ring-primary, #000000);
    --primary: var(--color-background-inverse, #000000);
    --primary-fg: var(--color-text-inverse, #ffffff);
    --ok: var(--color-text-success, #1e8a3e);
    --err: var(--color-text-danger, #e03131);
    --warn: var(--color-text-warning, #e07b00);
    --border: var(--color-border-primary, rgba(13, 13, 13, 0.1));
    --border-hover: var(--color-border-secondary, rgba(13, 13, 13, 0.15));
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  aside {
    width: 268px;
    min-width: 140px;
    border-right: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  aside .head, .section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  aside .head .spacer, .section-head .spacer { flex: 1; }
  #config-items { flex: 1; overflow: auto; padding: 6px; }
  .config-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 7px 9px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
  }
  .config-item:hover { background: var(--hover); }
  .config-item.selected { background: var(--selected); border-color: var(--accent); }
  .config-item .name { font-weight: 600; word-break: break-all; }
  .config-item .cmd {
    color: var(--fg-dim);
    font-family: var(--mono);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .config-item .ci-actions { display: flex; gap: 2px; justify-content: flex-end; }

  section#work {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    padding: 0;
    gap: 0;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  /* 日志区无内外间距:卡片铺满工作区,日志贴边(需求:取消日志区上下左右间距) */
  #console-box { flex: 1; display: flex; flex-direction: column; min-height: 0; border: none; border-radius: 0; }
  #console-box .body { flex: 1; display: flex; flex-direction: column; gap: 0; min-height: 0; padding: 0; }
  .card .body { padding: 0; }
  .form-grid {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 8px 10px;
    align-items: start;
  }
  .form-grid label { color: var(--fg-dim); padding-top: 5px; }
  input[type=text], textarea {
    width: 100%;
    background: var(--fill);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; }
  .hint { color: var(--fg-dim); font-size: 11px; margin-top: 3px; }

  button {
    background: var(--fill);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--border-hover); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
  button.small { padding: 2px 8px; font-size: 11px; }

  /* 标题区 = 运行配置下拉框:选中项即当前标题,可切换查看不同配置日志 */
  #cfg-select {
    font: inherit;
    font-weight: 600;
    color: var(--fg);
    background: var(--fill);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 6px;
    min-width: 60px;
    max-width: 240px;
    cursor: pointer;
    outline: none;
  }
  #cfg-select:hover { border-color: var(--border-hover); }
  #cfg-select:focus { border-color: var(--accent); }
  #cfg-select:disabled { opacity: 0.5; cursor: default; }

  /* 纯图标按钮(配置行 + 栏头工具):透明底,hover 才显边框,省横向空间 */
  .icon-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--fg-dim);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 13px;
    line-height: 1.6;
    cursor: pointer;
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); border-color: var(--border); color: var(--fg); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; }
  .icon-btn.go:hover:not(:disabled) { color: var(--ok); border-color: var(--ok); }
  .icon-btn.stop:hover:not(:disabled) { color: var(--err); border-color: var(--err); }

  #console-box .body { display: flex; flex-direction: column; gap: 0; }
  #console {
    flex: 1;
    background: var(--console-bg);
    border: 0;
    border-radius: 0;
    font-family: var(--mono);
    font-size: 12px;
    padding: 0;
    min-height: 200px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #console .l-stderr { color: var(--err); }
  #console .l-system { color: var(--warn); }
  #console .l-stdout { color: var(--fg); }

  .empty { color: var(--fg-dim); padding: 12px; text-align: center; }
  .tag { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
  .aside-show { display: none; }
  body.aside-hidden aside { display: none; }
  body.aside-hidden .aside-show { display: inline-block; }

  /* 配置编辑弹窗:遮罩 + 对话框,替代原 work 区编辑卡片 */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-mask[hidden] { display: none; }
  .modal {
    width: 480px;
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 48px);
    display: flex;
    flex-direction: column;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .modal .modal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .modal .modal-head .spacer { flex: 1; }
  .modal .modal-body { padding: 12px 14px; overflow: auto; }
  .modal .modal-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }
  .modal .modal-foot .spacer { flex: 1; }
  .modal .err-text { color: var(--err); font-size: 11px; }

  /* 日志右键菜单:仅样式取自主题变量,内容由 JS 控制 */
  .ctx-menu {
    position: fixed;
    z-index: 60;
    display: flex;
    flex-direction: column;
    min-width: 150px;
    padding: 4px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .ctx-menu[hidden] { display: none; }
  .ctx-menu button {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--fg);
    border-radius: 6px;
    cursor: pointer;
  }
  .ctx-menu button:hover { background: var(--hover); border-color: var(--border); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%) translateY(8px);
    background: var(--fill);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    max-width: 80vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 70;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--err); color: var(--err); }
</style>
</head>
<body class="aside-hidden">
<main>
  <button id="btn-aside-show" class="small aside-show" title="展开运行配置">»</button>
  <aside>
    <div class="head">
      运行配置
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-new" title="新建配置">＋</button>
      <button class="icon-btn" id="btn-dup" title="复制当前配置">⧉</button>

</main>

<!-- 配置编辑弹窗(新建 / 编辑共用) -->
<div id="cfg-modal" class="modal-mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <span id="modal-title">新建配置</span>

    </div>
    <div class="modal-body">
      <div class="form-grid">
        <label for="f-name">名称</label>

        <div>
          <input type="text" id="f-cwd" placeholder="留空 = 工作区根目录;可填相对或绝对路径">
          <div class="hint">相对路径相对于工作区根目录解析</div>
        </div>
        <label for="f-env">环境变量</label>
        <div>
          <textarea id="f-env" placeholder="每行一条 KEY=VALUE&#10;PORT=5173&#10;NODE_ENV=development"></textarea>
          <div class="hint">每行一条 KEY=VALUE,以 # 开头的行为注释</div>
        </div>
        <label for="f-preview">预览地址</label>
        <div>
          <input type="text" id="f-preview" placeholder="例如：http://localhost:5173">
          <div class="hint">配置后,该配置运行成功时自动打开预览</div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <span id="modal-error" class="err-text"></span>
      <span class="spacer"></span>
      <button id="modal-cancel">取消</button>
      <button id="modal-save" class="primary">保存</button>
    </div>
  </div>
</div>

<!-- 日志右键菜单 -->
<div id="ctx-menu" class="ctx-menu" hidden>
  <button data-act="insert">插入到输入框</button>
  <button data-act="copy">复制</button>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
/* ===========================================================================
 * bridge 适配层(独立块,便于集成期替换)
 * 协议来源:对 ZCode 官方 pdf-plugin 的 .zcode-plugin/plugin.json + dist/ui/panel.html
 * 反推得到的 MCP-over-postMessage 桥:
 *   - 面板 iframe 是一个 MCP client,JSON-RPC 2.0 消息原样经 window.parent.postMessage
 *     发往宿主,window "message" 事件收取(e.source 必须是 window.parent);
 *   - 握手:ui/initialize(protocolVersion "2026-01-26")-> ui/notifications/initialized
 *     (不要发 MCP initialize,宿主回 Method not found);
 *   - ui/initialize 的响应带 hostContext(含 theme),主题变化由
 *     ui/notifications/host-context-changed 通知推送(部分增量,可能只含 theme);
 *   - 之后走标准 MCP:tools/call、resources/read、resources/subscribe,
 *     服务端以 notifications/resources/updated 推送状态变化;
 *   - 日志插入输入框优先 ui/insert-input-text(VCode 扩展,文本进输入框不发送),
 *     老宿主降级 ui/update-model-context(插件上下文附到对话输入区);
 *     ui/message(以用户身份发送,宿主可能弹确认框)已不再使用。
 * ======================================================================== */
const Bridge = (() => {
  const pending = new Map();
  const resourceListeners = new Set();
  const teardownListeners = new Set();
  const themeListeners = new Set();
  let nextId = 1;
  let connected = false;

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && msg.id !== null && (msg.result !== undefined || msg.error !== undefined)) {
      const entry = pending.get(msg.id);
      if (!entry) return;
      pending.delete(msg.id);
      clearTimeout(entry.timer);
      if (msg.error) entry.reject(new Error(msg.error.message || "JSON-RPC error"));
      else entry.resolve(msg.result);
      return;
    }
    if (typeof msg.method === "string") {
      if (msg.method === "notifications/resources/updated") {
        for (const cb of resourceListeners) { try { cb(msg.params || {}); } catch (e) { console.error(e); } }
      } else if (msg.method === "ui/notifications/request-teardown") {
        for (const cb of teardownListeners) { try { cb(); } catch (e) { console.error(e); } }
      } else if (msg.method === "ui/notifications/host-context-changed") {
        // params 是部分上下文增量,只有主题变化时就只含 theme
        const ctx = msg.params || {};
        if (ctx.theme) {
          for (const cb of themeListeners) { try { cb(ctx); } catch (e) { console.error(e); } }
        }
      }
    }
  });

  function request(method, params, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("bridge 请求超时: " + method));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params: params || {} }, "*");
    });
  }

  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params: params || {} }, "*");
  }

  async function connect() {
    // The view<->host channel does NOT speak MCP "initialize" (the host replies
    // "Method not found"); the handshake is exactly: ui/initialize request
    // (UI protocol 2026-01-26) -> ui/notifications/initialized.
    const result = await request("ui/initialize", {
      appInfo: { name: "hba-run", version: "0.1.1" },
      appCapabilities: { tools: { listChanged: false }, availableDisplayModes: ["inline"] },
      protocolVersion: "2026-01-26"
    }, 5000);
    notify("ui/notifications/initialized", {});
    connected = true;
    return result;
  }

  async function callTool(name, args) {
    const result = await request("tools/call", { name, arguments: args || {} }, 30000);
    if (result && result.isError) {
      const text = (result.content || []).map((c) => c.text || "").join("\n");
      throw new Error(text || ("工具执行失败: " + name));
    }
    return result && result.structuredContent !== undefined ? result.structuredContent : result;
  }

  async function readResource(uri) {
    const result = await request("resources/read", { uri });
    return result && result.contents ? result.contents[0] : null;
  }

  async function subscribe(uri) {
    try { await request("resources/subscribe", { uri }); } catch (e) { console.warn(e); }
  }

  function onResourceUpdate(cb) { resourceListeners.add(cb); return () => resourceListeners.delete(cb); }
  function onTeardown(cb) { teardownListeners.add(cb); return () => teardownListeners.delete(cb); }
  function onThemeChange(cb) { themeListeners.add(cb); return () => themeListeners.delete(cb); }

  function sendSizeChanged() {
    const width = Math.ceil(window.innerWidth);
    const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
    notify("ui/notifications/size-changed", { width, height });
  }

  return {
    connect, request, notify, callTool, readResource, subscribe,
    onResourceUpdate, onTeardown, onThemeChange, sendSizeChanged,
    get connected() { return connected; }
  };
})();

/* ===========================================================================
 * 应用逻辑
 * ======================================================================== */
const $ = (id) => document.getElementById(id);

const App = {
  configs: [],
  runs: [],
  selectedConfigId: null,
  currentRunId: null,
  outputByRun: Object.create(null), // runId -> { lines: [], since: 0 }
  autoScroll: true,
  editingConfigId: null, // null = 弹窗处于「新建」模式;否则为被编辑配置 id
  pollTimer: null,
  refreshTimer: null,
  consoleRenderedRun: null // 当前 #console DOM 对应的 runId(增量追加的同步标记)
};

// 独立打开(无宿主)时直接拒绝工具调用,给出可读错误而不是桥超时。
function callTool(name, args) {
  if (window.parent === window) {
    return Promise.reject(new Error("独立模式:未连接宿主,无法调用 " + name));
  }
  return Bridge.callTool(name, args);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function parseEnvLines(text) {
  const env = {};
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const i = line.indexOf("=");
    if (i <= 0) continue;
    env[line.slice(0, i).trim()] = line.slice(i + 1);
  }
  return env;
}

function envToLines(env) {
  return Object.entries(env || {}).map(([k, v]) => k + "=" + v).join("\n");
}

// ---- ANSI 色码解析 --------------------------------------------------------
// 进程输出(vite/chalk 等)常带 SGR 色码,直接当文本渲染会显示成 [31m 这类乱码;
// 这里解析成带内联样式的 span,其余转义序列一律剥掉。调色板随主题切换。
const ANSI_PALETTE = {
  // 与 ZCode 内置终端同款(--color-terminal-* 的 zai-dark / zai-light 值)
  dark: ["#363636", "#ff5c5c", "#46bf72", "#ff8a30", "#4099ff", "#7b5ce5", "#42c8c8", "#adadad",
         "#747474", "#ff9999", "#87d9a4", "#ffb26b", "#80beff", "#a888f2", "#8ee5e5", "#f8f8f8"],
  light: ["#5c5c5c", "#e03131", "#1e8a3e", "#e07b00", "#0b7fff", "#9e77ed", "#0aa7a7", "#adadad",
          "#888888", "#e03131", "#1e8a3e", "#e07b00", "#0066dd", "#9e77ed", "#0aa7a7", "#0d0d0d"]
};

function ansiPalette() {
  return document.documentElement.dataset.theme === "light" ? ANSI_PALETTE.light : ANSI_PALETTE.dark;
}

function ansiColor256(n) {
  if (n < 16) return ansiPalette()[n];
  if (n >= 236) { const g = 8 + (n - 236) * 10; return `rgb(${g},${g},${g})`; }
  n -= 16;
  const f = (v) => (v ? 55 + v * 40 : 0);
  return `rgb(${f(Math.floor(n / 36))},${f(Math.floor((n % 36) / 6))},${f(n % 6)})`;
}

function stripAnsi(s) {
  return String(s)
    .replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?/g, "")
    .replace(/\x1b\[[0-9;:?]*[A-Za-z]/g, "")
    .replace(/\x1b[@-Z\\-_]/g, "");
}

function ansiToHtml(raw) {
  const text = String(raw);
  let out = "";
  let last = 0;
  let fg = "", bg = "", bold = false, dim = false, italic = false, underline = false;
  const flush = (end) => {
    if (end <= last) return;
    const chunk = escapeHtml(text.slice(last, end)).replace(/\x1b/g, "");
    const st = [];
    if (fg) st.push("color:" + fg);
    if (bg) st.push("background:" + bg);
    if (bold) st.push("font-weight:600");
    if (dim) st.push("opacity:.65");
    if (italic) st.push("font-style:italic");
    if (underline) st.push("text-decoration:underline");
    out += st.length ? '<span style="' + st.join(";") + '">' + chunk + "</span>" : chunk;
  };
  const applySgr = (params) => {
    const nums = (params || "0").split(";").map((x) => (x === "" ? 0 : parseInt(x, 10) || 0));
    for (let i = 0; i < nums.length; i++) {
      const c = nums[i];
      if (c === 0) { fg = bg = ""; bold = dim = italic = underline = false; }
      else if (c === 1) bold = true;
      else if (c === 2) dim = true;
      else if (c === 3) italic = true;
      else if (c === 4) underline = true;
      else if (c === 22) { bold = dim = false; }
      else if (c === 23) italic = false;
      else if (c === 24) underline = false;
      else if (c >= 30 && c <= 37) fg = ansiPalette()[c - 30];
      else if (c === 39) fg = "";
      else if (c >= 40 && c <= 47) bg = ansiPalette()[c - 40];
      else if (c === 49) bg = "";
      else if (c >= 90 && c <= 97) fg = ansiPalette()[c - 90 + 8];
      else if (c >= 100 && c <= 107) bg = ansiPalette()[c - 100 + 8];
      else if (c === 38 || c === 48) {
        let col = "";
        if (nums[i + 1] === 5) { col = ansiColor256(nums[i + 2] || 0); i += 2; }
        else if (nums[i + 1] === 2) {
          col = `rgb(${nums[i + 2] || 0},${nums[i + 3] || 0},${nums[i + 4] || 0})`;
          i += 4;
        }
        if (col) { if (c === 38) fg = col; else bg = col; }
      }
    }
  };
  const re = /\x1b\[([0-9;:?]*)m|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?|\x1b\[[0-9;:?]*[A-Za-z]|\x1b[@-Z\\-_]/g;
  let m;
  while ((m = re.exec(text))) {
    flush(m.index);
    if (m[1] !== undefined) applySgr(m[1]);
    last = re.lastIndex;
  }
  flush(text.length);
  return out;
}

function toast(msg, isErr) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = "toast"; }, 2800);
}

// ---- 主题 ------------------------------------------------------------------

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
  renderConsole(); // ANSI 调色板随主题切换,日志重上色
}

function systemTheme() {
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
    ? "light" : "dark";
}

// ---- 渲染 ------------------------------------------------------------------

/** 该配置当前是否有运行中的 run(行内 ▶/■ 按钮的启停依据)。 */
function runningRunOf(configId) {
  return App.runs.find((r) => r.configId === configId && r.state === "running") || null;
}

/** 标题区:配置下拉框(选中项即标题)+ 按运行态切换 启动 / 重启+停止。 */
function renderConsoleHead() {
  const sel = $("cfg-select");
  const prev = App.selectedConfigId || "";
  sel.innerHTML = App.configs.length
    ? App.configs.map((c) => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("")
    : '<option value="">暂无配置</option>';
  sel.value = prev;
  if (sel.value !== prev) sel.selectedIndex = 0;
  const has = !!App.selectedConfigId;
  const running = has && !!runningRunOf(App.selectedConfigId);
  $("btn-h-start").hidden = running;
  $("btn-h-restart").hidden = !running;
  $("btn-h-stop").hidden = !running;
  $("btn-h-start").disabled = !has;
  $("btn-h-restart").disabled = !has;
  $("btn-h-stop").disabled = !has;
}

function renderConfigs() {
  const box = $("config-items");
  renderConsoleHead();
  if (!App.configs.length) {
    box.innerHTML = '<div class="empty">暂无配置,点「＋」创建</div>';
    $("btn-dup").disabled = true;
    $("btn-del").disabled = true;
    return;
  }
  box.innerHTML = App.configs.map((c) => {
    const running = !!runningRunOf(c.id);
    return `
    <div class="config-item ${c.id === App.selectedConfigId ? "selected" : ""}" data-id="${escapeHtml(c.id)}">
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="cmd" title="${escapeHtml(c.command)}">${escapeHtml(c.command)}</div>
      <div class="ci-actions">
        <button class="icon-btn" data-act="edit" title="编辑配置">✎</button>
        <button class="icon-btn go" data-act="start" title="运行该配置" ${running ? "disabled" : ""}>▶</button>
        <button class="icon-btn stop" data-act="stop" title="停止该配置" ${running ? "" : "disabled"}>■</button>
        <button class="icon-btn" data-act="restart" title="重启(先停止再启动同一配置)">↻</button>
      </div>
    </div>`;
  }).join("");
  for (const el of box.querySelectorAll(".config-item")) {
    const id = el.dataset.id;
    el.addEventListener("click", () => selectConfig(id).catch((e) => toast(e.message, true)));
    // 双击行 = 打开编辑弹窗(与 ✎ 等价,避免误触直接跑命令)
    el.addEventListener("dblclick", () => openModal(id));
    for (const btn of el.querySelectorAll("[data-act]")) {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === "edit") { selectConfig(id); openModal(id); }
        else if (act === "start") startRunOf(id).catch((e2) => toast(e2.message, true));
        else if (act === "stop") stopConfig(id).catch((e2) => toast(e2.message, true));
        else if (act === "restart") restartConfig(id).catch((e2) => toast(e2.message, true));
      });
    }
  }
  const hasSel = !!App.selectedConfigId;
  $("btn-dup").disabled = !hasSel;
  $("btn-del").disabled = !hasSel;
}

function consoleLineEl(l) {
  const div = document.createElement("div");
  div.className = "l-" + (l.stream || "stdout");
  div.innerHTML = ansiToHtml(l.text);
  return div;
}

/**
 * 日志区的「磁性跟随」规则:
 *  - 仅当用户本来就贴底时才跟随新输出滚到底;翻上去看日志时不被拉回;
 *  - 有未收起的选区(正在拖选/准备右键发送)时不滚动,避免拖拽终点被带走;
 *  - 日志 DOM 增量追加而非整体重建,选区锚点不会中途被毁。
 */
function consoleFollowAllowed(box) {
  if (!App.autoScroll) return false;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return false;
  return box.scrollHeight - box.scrollTop - box.clientHeight <= 40;
}

function renderConsole() {
  const tag = $("console-run-tag");
  const box = $("console");
  const view = App.outputByRun[App.currentRunId];
  const run = App.runs.find((r) => r.runId === App.currentRunId);
  tag.textContent = App.currentRunId
    ? (run ? (run.configName || run.command) + " · " + App.currentRunId : App.currentRunId)
    : "";
  App.consoleRenderedRun = App.currentRunId;
  if (!view || !view.lines.length) {
    box.innerHTML = '<div class="empty">' +
      (App.currentRunId ? "暂无输出" : "选择配置查看输出") + "</div>";
    return;
  }
  const frag = document.createDocumentFragment();
  for (const l of view.lines) frag.appendChild(consoleLineEl(l));
  box.innerHTML = "";
  box.appendChild(frag);
  if (App.autoScroll) box.scrollTop = box.scrollHeight;
}

/** 增量追加新行。整体重建会毁掉进行中的选区(表现为"选择从日志开头起选"),必须避免。 */
function appendConsoleLines(newLines) {
  const box = $("console");
  if (App.consoleRenderedRun !== App.currentRunId) {
    renderConsole(); // DOM 与当前运行不同步(切运行/清空后),退回整体渲染
    return;
  }
  if (!newLines || !newLines.length) return;
  const follow = consoleFollowAllowed(box);
  const emptyEl = box.querySelector(".empty");
  if (emptyEl) box.removeChild(emptyEl);
  for (const l of newLines) box.appendChild(consoleLineEl(l));
  if (follow) box.scrollTop = box.scrollHeight;
}

const previewShown = new Set();

function maybeAutoPreview() {
  // FR-4-4 (revised): the header preview button was removed; a preview URL now
  // opens automatically when its run finishes successfully (once per run).
  for (const r of App.runs) {
    if (r.state === "exited" && !r.stopped && !r.spawnError && r.configId && !previewShown.has(r.runId)) {
      previewShown.add(r.runId);
      const c = App.configs.find((x) => x.id === r.configId);
      if (c && c.previewUrl) openPreview(c.previewUrl);
    }
  }
}

// ---- 配置编辑弹窗 ----------------------------------------------------------

function openModal(configId) {
  App.editingConfigId = configId || null;
  const c = configId ? App.configs.find((x) => x.id === configId) : null;
  $("modal-title").textContent = c ? "编辑配置" : "新建配置";
  $("f-name").value = c ? c.name : "";
  $("f-command").value = c ? c.command : "";
  $("f-cwd").value = c ? (c.cwd || "") : "";
  $("f-env").value = c ? envToLines(c.env) : "";
  $("f-preview").value = c ? (c.previewUrl || "") : "";
  $("modal-error").textContent = "";
  $("cfg-modal").hidden = false;
  $("f-name").focus();
}

function closeModal() {
  $("cfg-modal").hidden = true;
  App.editingConfigId = null;
}

async function saveModal() {
  const payload = {
    name: $("f-name").value.trim(),
    command: $("f-command").value.trim(),
    cwd: $("f-cwd").value.trim(),
    env: parseEnvLines($("f-env").value),
    previewUrl: $("f-preview").value.trim()
  };
  if (!payload.name || !payload.command) {
    $("modal-error").textContent = "名称和启动命令不能为空";
    return;
  }
  if (App.editingConfigId) payload.id = App.editingConfigId;
  try {
    const res = await callTool("run_config_save", payload);
    if (res.config) App.selectedConfigId = res.config.id;
    closeModal();
    await refreshConfigs();
    scheduleUiStateSave();
  } catch (e) {
    $("modal-error").textContent = e.message;
  }
}

// ---- 动作 ------------------------------------------------------------------

async function selectConfig(id) {
  App.selectedConfigId = id;
  renderConfigs();
  // 切换配置即换日志:优先该配置最近一次活运行;没有活运行则回放最近一次历史日志;
  // 两者都没有才切空日志,不残留其他配置的输出。
  const run = App.runs.filter((r) => r.configId === id).pop();
  if (run) {
    if (run.runId !== App.currentRunId) selectRun(run.runId);
    scheduleUiStateSave();
    return;
  }
  try {
    const res = await callTool("run_history", { limit: 50 });
    // 等待期间用户可能已切走:只在仍选中该配置时应用,避免旧查询覆盖新选择
    if (App.selectedConfigId !== id) return;
    const entry = (res.history || []).find((h) => h.configId === id);
    if (entry) {
      selectRun(entry.id);
      scheduleUiStateSave();
      return;
    }
  } catch (e) {
    /* 历史不可用时按无日志处理 */
  }
  if (App.selectedConfigId !== id) return;
  if (App.currentRunId) {
    App.currentRunId = null;
    renderConsole();
    scheduleUiStateSave();
  }
  scheduleUiStateSave();
}

function selectRun(runId) {
  App.currentRunId = runId;
  if (!App.outputByRun[runId]) App.outputByRun[runId] = { lines: [], since: 0 };
  renderConsole();
  fetchOutput(runId).catch((e) => console.warn(e));
  scheduleUiStateSave();
}

async function refreshAll() {
  await Promise.all([refreshConfigs(), refreshRuns()]);
}

async function refreshConfigs() {
  const res = await callTool("run_config_list", {});
  const configs = res.configs || [];
  const changed = JSON.stringify(configs) !== JSON.stringify(App.configs);
  App.configs = configs;
  const prevSelected = App.selectedConfigId;
  if (App.selectedConfigId && !App.configs.some((c) => c.id === App.selectedConfigId)) {
    App.selectedConfigId = null;
  }
  if (!App.selectedConfigId && App.configs.length) {
    App.selectedConfigId = App.configs[0].id;
  }
  // 兜底轮询会高频调用本函数;数据没变就不重建 DOM,避免打断 hover/焦点
  if (changed || prevSelected !== App.selectedConfigId) renderConfigs();
}

async function refreshRuns() {
  const res = await callTool("run_status", {});
  App.runs = res.runs || [];
  // 运行态变化会翻转行内 ▶/■ 的可用性,配置列表也要重绘
  renderConfigs();
  maybeAutoPreview();
}

async function fetchOutput(runId) {
  const view = App.outputByRun[runId] || (App.outputByRun[runId] = { lines: [], since: 0 });
  const res = await callTool("run_output", { runId, since: view.since });
  const newLines = res.lines || [];
  let truncated = false;
  if (newLines.length) {
    view.lines.push(...newLines);
    if (view.lines.length > 5000) {
      view.lines.splice(0, view.lines.length - 5000);
      truncated = true;
    }
  }
  view.since = res.nextSince !== undefined ? res.nextSince : view.since;
  if (App.currentRunId !== runId) return;
  // 没有新行时完全不碰 DOM:轮询每 1.2s 一次,重建会打断用户的选择
  if (truncated) renderConsole();
  else appendConsoleLines(newLines);
}

async function deleteConfig() {
  if (!App.selectedConfigId) return;
  if (!confirm("确认删除该运行配置?历史记录会保留。")) return;
  await callTool("run_config_delete", { configId: App.selectedConfigId });
  App.selectedConfigId = null;
  await refreshConfigs();
  scheduleUiStateSave();
}

async function duplicateConfig() {
  if (!App.selectedConfigId) return;
  const res = await callTool("run_config_duplicate", { configId: App.selectedConfigId });
  if (res.config) App.selectedConfigId = res.config.id;
  await refreshConfigs();
  scheduleUiStateSave();
}

async function startRunOf(configId) {
  const res = await callTool("run_start", { configId });
  if (res.run) {
    App.selectedConfigId = configId;
    selectRun(res.run.runId);
  }
  await refreshRuns();
}

async function stopConfig(configId) {
  const run = runningRunOf(configId);
  if (!run) return;
  await stopRun(run.runId);
}

async function stopRun(runId) {
  // 失败直接抛出,由调用方统一 toast,避免重复提示
  await callTool("run_stop", { runId });
  // 停止是异步生效的,稍等后刷新一次即可翻转按钮状态
  setTimeout(() => { refreshRuns().catch(() => {}); }, 800);
}

async function restartConfig(configId) {
  const run = runningRunOf(configId);
  if (run) {
    await callTool("run_stop", { runId: run.runId, timeoutMs: 2000 });
    // 等旧 run 真正退出再启动,避免同配置双实例并存的观感
    for (let i = 0; i < 20; i++) {
      const s = await callTool("run_status", { runId: run.runId });
      if (!s.run || s.run.state !== "running") break;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  await startRunOf(configId);
}

function openPreview(url) {
  if (!url) return;
  window.open(url, "_blank", "noopener,noreferrer");
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
}

async function copyConsole() {
  const view = App.outputByRun[App.currentRunId];
  const text = view ? view.lines.map((l) => stripAnsi(l.text)).join("\n") : "";
  if (!text) return;
  await copyText(text);
}

function clearConsole() {
  if (!App.currentRunId) return;
  const view = App.outputByRun[App.currentRunId];
  // 清空只是清「我的视图」:必须保留 since 游标,否则下一次拉取会把
  // 服务端环形缓冲区从头(seq 1)整个拉回来,表现为「清空无效」。
  App.outputByRun[App.currentRunId] = { lines: [], since: view ? view.since : 0 };
  renderConsole();
  fetchOutput(App.currentRunId).catch(() => {});
}

// ---- 日志右键「插入到输入框」 ----------------------------------------------
// 旧实现走 ui/message(以用户身份发送),宿主会弹「插件想以你的身份发送消息」确认框。
// 现改为直接插入会话输入框,不发送、不弹框:
//   1) ui/insert-input-text(VCode 扩展桥方法):文本进输入框,用户改完自己发;
//   2) 老宿主降级 ui/update-model-context:以「插件上下文」附在对话输入区,同样不弹框,
//      发送时内容与正文一并送达模型;
//   3) 两者都不可用(独立模式/无 composer)才退到剪贴板。

function hideCtxMenu() {
  $("ctx-menu").hidden = true;
}

async function insertSelectionToInput(text) {
  const payload = "【运行输出摘录 · " + (App.currentRunId || "未知运行") + "】\n" + text;
  if (window.parent === window || !Bridge.connected) {
    // 独立模式没有宿主可以代发,降级为复制到剪贴板
    await copyText(payload);
    toast("独立模式:无法插入输入框,已复制到剪贴板");
    return;
  }
  try {
    await Bridge.request("ui/insert-input-text", { text: payload });
    toast("已插入到输入框");
    return;
  } catch (e) {
    /* 老宿主没有该桥方法(-32601),继续降级 */
  }
  try {
    await Bridge.request("ui/update-model-context", {
      content: [{ type: "text", text: payload }]
    });
    toast("已添加到对话输入区(宿主不支持直插文本,以插件上下文附上)");
    return;
  } catch (e) {
    /* 没有 composer 接住等,继续降级 */
  }
  await copyText(payload);
  toast("宿主不支持插入输入框,已复制到剪贴板");
}

function setupCtxMenu() {
  const menu = $("ctx-menu");
  const consoleEl = $("console");
  consoleEl.addEventListener("contextmenu", (e) => {
    const sel = String(window.getSelection() || "");
    if (!sel.trim()) { hideCtxMenu(); return; } // 无选中时保留原生菜单
    e.preventDefault();
    menu.hidden = false;
    // 先显示再夹取,避免菜单超出视口
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    menu.style.left = Math.min(e.clientX, window.innerWidth - mw - 8) + "px";
    menu.style.top = Math.min(e.clientY, window.innerHeight - mh - 8) + "px";
  });
  for (const btn of menu.querySelectorAll("[data-act]")) {
    btn.addEventListener("click", () => {
      const sel = String(window.getSelection() || "");
      hideCtxMenu();
      if (!sel.trim()) return;
      if (btn.dataset.act === "insert") insertSelectionToInput(sel).catch((e) => toast(e.message, true));
      else copyText(sel).then(() => toast("已复制选中文本")).catch(() => toast("复制失败", true));
    });
  }
  document.addEventListener("click", hideCtxMenu);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideCtxMenu(); });
  window.addEventListener("scroll", hideCtxMenu, true);
}

// ---- 面板状态持久化(B 方案:项目级共享) --------------------------------------
// UI 状态(选中配置/当前运行/自动滚动/侧栏折叠)经 run_ui_state 工具持久化到
// <workspace>/.hba/run-ui-state.json:同项目所有会话/窗口的运行面板共享一份
// 状态,打开面板即恢复。独立模式(未连接宿主)不持久化。
const UI_STATE_SAVE_DEBOUNCE_MS = 500;
let uiStateTimer = null;
let uiStateRestoring = false;

function currentUiState() {
  return {
    selectedConfigId: App.selectedConfigId,
    currentRunId: App.currentRunId,
    autoScroll: App.autoScroll,
    asideCollapsed: document.body.classList.contains("aside-hidden")
  };
}

function scheduleUiStateSave() {
  if (uiStateRestoring || window.parent === window || !Bridge.connected) return;
  if (uiStateTimer) clearTimeout(uiStateTimer);
  uiStateTimer = setTimeout(() => {
    uiStateTimer = null;
    callTool("run_ui_state", { state: currentUiState() }).catch(() => {});
  }, UI_STATE_SAVE_DEBOUNCE_MS);
}

async function loadUiState() {
  try {
    const res = await callTool("run_ui_state", {});
    return res && res.state && typeof res.state === "object" ? res.state : null;
  } catch {
    return null;
  }
}

function applyUiChromeState(saved) {
  if (typeof saved.autoScroll === "boolean") {
    App.autoScroll = saved.autoScroll;
    $("chk-autoscroll").checked = saved.autoScroll;
  }
  if (typeof saved.asideCollapsed === "boolean") {
    document.body.classList.toggle("aside-hidden", saved.asideCollapsed);
  }
}

async function restoreCurrentRun(runId) {
  App.currentRunId = runId;
  if (!App.outputByRun[runId]) App.outputByRun[runId] = { lines: [], since: 0 };
  try {
    await fetchOutput(runId);
  } catch {
    // 运行记录已滚出历史,恢复不了就回落到空控制台
    App.currentRunId = null;
  }
  renderConsole();
}

// ---- 启动 ------------------------------------------------------------------

function scheduleRefresh() {
  if (App.refreshTimer) return;
  App.refreshTimer = setTimeout(() => {
    App.refreshTimer = null;
    // 配置列表必须一起刷:Agent 可经 run_config_* 工具改配置,
    // 服务端 run_config_save/delete/duplicate 都会发 resources/updated
    Promise.all([refreshConfigs(), refreshRuns()])
      .then(() => {
        if (App.currentRunId) return fetchOutput(App.currentRunId);
      })
      .catch((e) => console.warn(e));
  }, 250);
}

// 无活动进程时配置变更的兜底轮询:宿主不转发 resources/updated 时,
// 面板也能在数秒内同步 Agent 经工具做的配置改动(见 batch-report 待联测项)。
const CONFIG_POLL_MS = 5000;
let lastConfigPollAt = 0;

function pollConfigsThrottled() {
  const now = Date.now();
  if (now - lastConfigPollAt < CONFIG_POLL_MS) return;
  lastConfigPollAt = now;
  refreshConfigs().catch(() => {});
}

function startPolling() {
  if (App.pollTimer) return;
  App.pollTimer = setInterval(() => {
    pollConfigsThrottled();
    const anyRunning = App.runs.some((r) => r.state === "running");
    if (!anyRunning) return;
    refreshRuns()
      .then(() => (App.currentRunId ? fetchOutput(App.currentRunId) : null))
      .catch(() => {});
  }, 1200);
}

async function init() {
  // 启动先落一个系统主题兜底;连上宿主后由 hostContext 覆盖
  applyTheme(systemTheme());
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: light)");
    if (mq.addEventListener) {
      mq.addEventListener("change", () => { if (!Bridge.connected) applyTheme(systemTheme()); });
    }
  }

  // 事件绑定
  $("btn-new").addEventListener("click", () => openModal(null));
  $("btn-del").addEventListener("click", () => deleteConfig().catch((e) => toast(e.message, true)));
  $("btn-dup").addEventListener("click", () => duplicateConfig().catch((e) => toast(e.message, true)));
  $("btn-clear").addEventListener("click", clearConsole);
  $("btn-copy").addEventListener("click", () => copyConsole().catch((e) => console.warn(e)));
  $("chk-autoscroll").addEventListener("change", (e) => {
    App.autoScroll = e.target.checked;
    if (App.autoScroll) renderConsole();
    scheduleUiStateSave();
  });
  // 标题区:下拉框切换配置(换日志)+ 按运行态显示的 启动 / 重启 / 停止
  $("cfg-select").addEventListener("change", (e) => {
    const id = e.target.value;
    if (id) selectConfig(id).catch((err) => toast(err.message, true));
  });
  $("btn-h-start").addEventListener("click", () => {
    if (App.selectedConfigId) startRunOf(App.selectedConfigId).catch((e) => toast(e.message, true));
  });
  $("btn-h-restart").addEventListener("click", () => {
    if (App.selectedConfigId) restartConfig(App.selectedConfigId).catch((e) => toast(e.message, true));
  });
  $("btn-h-stop").addEventListener("click", () => {
    if (App.selectedConfigId) stopConfig(App.selectedConfigId).catch((e) => toast(e.message, true));
  });
  $("btn-aside-hide").addEventListener("click", () => {
    document.body.classList.add("aside-hidden");
    scheduleUiStateSave();
  });
  $("btn-aside-show").addEventListener("click", () => {
    document.body.classList.remove("aside-hidden");
    scheduleUiStateSave();
  });
  $("modal-save").addEventListener("click", () => saveModal());
  $("modal-cancel").addEventListener("click", closeModal);
  $("modal-close").addEventListener("click", closeModal);
  $("cfg-modal").addEventListener("click", (e) => { if (e.target === $("cfg-modal")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("cfg-modal").hidden) closeModal();
  });
  setupCtxMenu();

  // 先落一次标题区状态(无配置=下拉占位+按钮禁用),避免首帧三个按钮齐亮
  renderConsoleHead();

  if (window.parent === window) {
    return; // standalone preview mode: no host bridge
  }

  let initResult = null;
  try {
    initResult = await Bridge.connect();
  } catch (e) {
    console.warn("bridge connect failed:", e);
    return;
  }

  // hostContext 携带初始主题;之后的变化走 host-context-changed 通知
  if (initResult && initResult.hostContext && initResult.hostContext.theme) {
    applyTheme(initResult.hostContext.theme);
  }
  Bridge.onThemeChange((ctx) => { if (ctx && ctx.theme) applyTheme(ctx.theme); });

  Bridge.onResourceUpdate(() => {
    scheduleRefresh();
    if (App.currentRunId) fetchOutput(App.currentRunId).catch(() => {});
    startPolling();
  });
  Bridge.onTeardown(() => {
    if (App.pollTimer) clearInterval(App.pollTimer);
    if (App.refreshTimer) clearTimeout(App.refreshTimer);
  });

  await Bridge.subscribe("ui://run/state");

  // 恢复共享面板状态(B 方案):先恢复外观与选中配置,refreshAll 之后恢复当前运行
  // 及其日志(run_output 对活运行和历史记录都能回放)。
  const savedUi = await loadUiState();
  uiStateRestoring = true;
  try {
    if (savedUi) {
      applyUiChromeState(savedUi);
      if (savedUi.selectedConfigId) App.selectedConfigId = savedUi.selectedConfigId;
    }
    await refreshAll();
    if (savedUi && savedUi.currentRunId) await restoreCurrentRun(savedUi.currentRunId);
  } finally {
    uiStateRestoring = false;
  }
  startPolling();
  Bridge.sendSizeChanged();
  window.addEventListener("resize", () => Bridge.sendSizeChanged());
}

init().catch((e) => {
  // No header status badge any more; surface init errors in the console.
  console.error(e);
});
</script>
</body>
</html>
